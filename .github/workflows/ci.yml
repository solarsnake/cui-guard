name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A SKIPPED gate fails every job (a skip is never silent in CI).
env:
  CUI_GUARD_STRICT: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install locked dev dependencies
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --group dev
      - name: Gates
        run: scripts/check lint lock test leak fuzz

  fips:
    name: FIPS provider checks (UBI 9 container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FIPS gate
        # Fail, not skip, when the runner has no working Docker daemon.
        run: |
          docker info > /dev/null
          scripts/check fips

  security:
    name: security gates and report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON_DOWNLOADS: never
      # A SKIPPED gate fails here (scripts/check and report.py strict mode).
      CUI_GUARD_STRICT: "1"
      # Release tarball checksum from gitleaks_8.30.1_checksums.txt.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install locked dev dependencies
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --group dev
      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      # `report` runs every gate (including the absolute-latency `perf` tests, which run
      # only here, on one Linux runner), continues past failures, writes the report and
      # exits 1 on any failure, so the summary and upload below still have a report to publish.
      - name: Gates and report
        run: scripts/check report
      - name: Add report to the job summary
        if: ${{ !cancelled() }}
        run: cat build/security-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: build/security-report
          if-no-files-found: error
