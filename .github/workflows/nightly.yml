name: Nightly security checks

on:
  schedule:
    - cron: "41 3 * * *"

permissions: {}

# A SKIPPED gate fails every job (a skip is never silent in CI).
env:
  CUI_GUARD_STRICT: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        id: py
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install locked dev dependencies
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --group dev
      - name: Fuzz (nightly profile)
        env:
          HYPOTHESIS_PROFILE: nightly
        run: scripts/check fuzz
      - name: Dependency audit
        run: scripts/check audit

  open-issue:
    needs: checks
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'The nightly security checks failed.\n\nRun: %s\n' "$RUN_URL" > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "nightly security check failed" --body-file "$RUNNER_TEMP/issue-body.md"
