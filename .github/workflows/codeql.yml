name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          # Code scanning upload needs GitHub Advanced Security on a private repo; there the
          # SARIF stays local and the gate below still runs on it.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      # Gate: any error or warning result not triaged in security/codeql-triage.json fails the
      # job. Dismissing an alert in the GitHub UI does not count.
      - name: CodeQL gate
        run: python3 scripts/security/sarif_gate.py check sarif-results/*.sarif
