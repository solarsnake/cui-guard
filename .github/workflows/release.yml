name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON_DOWNLOADS: never
      # A SKIPPED gate fails the release (scripts/check and report.py strict mode).
      CUI_GUARD_STRICT: "1"
      # Same checksum-pinned gitleaks as ci.yml (gitleaks_8.30.1_checksums.txt).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the secrets gate scans every commit.
          fetch-depth: 0
      - name: Set up Python
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install locked dev dependencies
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --group dev
      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      # `report` runs every gate (build and sbom included), writes the report and exits 1 on any
      # failure or skip.
      - name: Gates, build, SBOM and report
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          scripts/check report
      - name: Add report to the job summary
        if: ${{ !cancelled() }}
        run: cat build/security-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: build/security-report
          if-no-files-found: error
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/dist-a/*
            build/sbom/*
            build/security-report/*
            security/vex.cdx.json
            build/locks/runtime.lock.txt
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files
      # Every release asset is a provenance subject: the wheel and sdist, the SBOM, the VEX, the
      # runtime hash lock and the security report.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            files/build/dist-a/*
            files/build/sbom/cui-guard.cdx.json
            files/security/vex.cdx.json
            files/build/locks/runtime.lock.txt
            files/build/security-report/summary.md
            files/build/security-report/report.json
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: files/build/dist-a/*
          sbom-path: files/build/sbom/cui-guard.cdx.json

  publish:
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: files/build/dist-a/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            files/build/dist-a/* \
            files/build/sbom/* \
            files/build/security-report/summary.md \
            files/build/security-report/report.json \
            files/security/vex.cdx.json \
            files/build/locks/runtime.lock.txt
