# Secret detectors (gitleaks-style). Hits keep credentials away from every model.
# Rules with a named group `value` hit only that group.

[[rule]]
id = "secret.aws-access-key"
class = "secret"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'''
kind = "secret"
verified = true
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rule]]
id = "secret.github-token"
class = "secret"
regex = '''\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b'''
kind = "secret"
verified = true
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rule]]
id = "secret.anthropic-key"
class = "secret"
regex = '''\bsk-ant-[A-Za-z0-9_\-]{20,}'''
kind = "secret"
verified = true
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rule]]
id = "secret.openai-key"
class = "secret"
regex = '''\bsk-(?!ant-)(?:proj-|svcacct-)?[A-Za-z0-9_\-]{20,}'''
kind = "secret"
verified = false
source = "model-knowledge"

[[rule]]
id = "secret.slack-token"
class = "secret"
regex = '''\bxox[abprs]-[A-Za-z0-9\-]{10,}'''
kind = "secret"
verified = true
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rule]]
id = "secret.private-key-block"
class = "secret"
regex = '''-{5}BEGIN [A-Z ]*PRIVATE KEY(?: BLOCK)?-{5}[\s\S]*?-{5}END [A-Z ]*PRIVATE KEY(?: BLOCK)?-{5}'''
kind = "secret"
verified = true
source = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rule]]
id = "secret.assignment"
class = "secret"
regex = '''\b(?:password|passwd|token)\b[ \t]*[=:][ \t]*["']?(?P<value>[^\s"']+)'''
flags = ["IGNORECASE"]
kind = "secret"
verified = false
source = "model-knowledge"

[[rule]]
id = "secret.url-credentials"
class = "secret"
regex = '''\b[a-z][a-z0-9+.\-]*://[^\s:/@]+:(?P<value>[^\s@/]+)@'''
flags = ["IGNORECASE"]
kind = "secret"
verified = false
source = "model-knowledge"
