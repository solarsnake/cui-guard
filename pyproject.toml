[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cui-guard"
version = "0.1.0"
description = "Local gateway that keeps controlled data off public LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
ner = ["presidio-analyzer", "spacy"]
macos = ["pyobjc-framework-LocalAuthentication; sys_platform=='darwin'"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "hypothesis", "pip-audit", "cyclonedx-bom", "zizmor", "uv>=0.9.17", "pyyaml"]

[project.scripts]
cui-guard = "cui_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cui_guard"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["build/sbom/cui-guard.cdx.json"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
markers = [
    "network: needs the package index (uv lock)",
    "perf: absolute latency budget; run by the perf gate (scripts/check perf), not the test gate",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "S603", "S607"]
