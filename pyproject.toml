[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "cui-guard"
version = "0.1.0"
description = "Local gateway that keeps controlled data off public LLMs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
ner = ["presidio-analyzer", "spacy"]
macos = ["pyobjc-framework-LocalAuthentication; sys_platform=='darwin'"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "hypothesis", "pip-audit", "cyclonedx-bom", "zizmor", "uv>=0.9.17"]

[project.scripts]
cui-guard = "cui_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cui_guard"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
markers = ["network: needs the package index (uv lock)"]
asyncio_mode = "auto"
testpaths = ["tests"]
